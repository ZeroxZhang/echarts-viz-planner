# trend 族 · 趋势（details 惰性层）
# 用途：选型 Step 4 对 top-3 候选做两两对抗复核时读取。

- id: line.basic
  name: 折线图
  family: trend
  runtime: { series: line, coord: grid, source: native }
  contract:
    required: [time_field, value]
    time_granularity: any
  tasks: { primary: [trend], secondary: [multi_trend] }
  reject_if:
    - 时间点 ≤ 2 → 改 bar.basic 或 text.conclusion
    - 类目是离散类别而非时间/有序 → 改 bar.basic
    - 数值构成整体 → 改 line.stacked_area
  adjacent: [line.multi, line.area, bar.basic]
  risks: [Y 轴不从 0 起会夸大波动（必须标注截断）, 断点数据需显式插值说明]
  pair_with: [table.detail]
  config: { xAxis: { type: "time" }, dataZoom + thumbnail（大数据量）}

- id: line.multi
  name: 多序列折线
  family: trend
  runtime: { series: line, coord: grid, source: native }
  contract:
    required: [time_field, series_dim, value]
    series_count: { ok: [2, 5], warn_above: 6 }
  tasks: { primary: [multi_trend], secondary: [trend] }
  reject_if:
    - 序列 > 6 → 高密度重叠，改用 dataZoom + 高亮交互，或转小倍数（small multiples）
    - 序列量纲差异大且要看波动形态 → 归一化并显式标注
  adjacent: [line.stacked_area, themeriver.themeriver, bar.grouped]
  risks: [线条颜色区分度上限约 8, 交叉密集处难追踪]
  pair_with: [table.detail]
  config: { legend + tooltip trigger: "axis", 强调色只给主序列 }

- id: line.area
  name: 面积图
  family: trend
  runtime: { series: line, coord: grid, source: native }
  contract:
    required: [time_field, value]
  tasks: { primary: [volume_trend], secondary: [trend] }
  reject_if:
    - 数值无总量语义（比率/单价）→ 改 line.basic
    - 单序列且只想看走势 → line.basic 更克制
  adjacent: [line.basic, line.stacked_area]
  risks: [填充色易喧宾夺主, 从 0 起算更稳妥]
  pair_with: [text.conclusion]

- id: line.stacked_area
  name: 堆叠面积图
  family: trend
  runtime: { series: line, coord: grid, source: native }
  contract:
    required: [time_field, series_dim, value]
    series_count: { ok: [2, 4], warn_above: 4 }
  tasks: { primary: [composition_over_time], secondary: [multi_trend] }
  reject_if:
    - 层数 > 4 → 中部层形态扭曲（禁用线：叠加超 4 层），改 themeriver 或 top-N + 其他
    - 各序列独立不构成总量 → 改 line.multi
  adjacent: [themeriver.themeriver, line.multi, bar.pct]
  risks: [中间层基线漂移, 底部层被夸大]
  pair_with: [table.pivot]

- id: line.step
  name: 阶梯折线图
  family: trend
  runtime: { series: line, coord: grid, source: native }
  contract:
    required: [time_field, value]
  tasks: { primary: [discrete_trend], secondary: [trend] }
  reject_if:
    - 数值是连续测量 → 改 line.basic（阶梯只适合离散跳变：利率/档位/事件）
  adjacent: [line.basic]
  risks: [step 位置（before/after/middle）必须符合业务语义]
  config: { step: "end"（按业务语义选择）}

- id: candlestick.k
  name: 蜡烛图
  family: trend
  runtime: { series: candlestick, coord: grid, source: native }
  contract:
    required: [time, open, close, low, high]
  tasks: { primary: [financial_trend], secondary: [volatility] }
  reject_if:
    - 没有 OHLC 四值 → 改 line.basic + 区间
    - 非金融/行情场景 → 慎用（读者可能不熟悉蜡烛语义）
  adjacent: [line.basic, ext.line-range]
  risks: [涨跌配色须符合目标市场惯例, 非专业受众需图例解释]
  pair_with: [table.detail]
  config: { dataZoom（区间浏览）, 涨跌色随市场惯例 }

- id: themeriver.themeriver
  name: 主题河流图
  family: trend
  runtime: { series: themeRiver, coord: singleAxis, source: native }
  contract:
    required: [time_field, series_dim, value]
    series_count: { ok: [3, 12], warn_above: 12 }
  tasks: { primary: [composition_over_time], secondary: [multi_trend] }
  reject_if:
    - 序列 < 3 → 改 line.stacked_area
    - 需要精确读数 → 改 line.stacked_area + 表格（河流图只表达宏观涨落）
  adjacent: [line.stacked_area, line.multi, bar.pct]
  risks: [单个序列边界难精确追踪, 大面积色块占视觉主导]
  pair_with: [table.detail]

- id: ext.line-range
  name: 区间折线图
  family: trend
  runtime: { series: custom, source: ext:@echarts-x/custom-line-range@1.x }
  contract:
    required: [time_field, low_value, high_value]
  tasks: { primary: [band_trend], secondary: [trend] }
  reject_if:
    - allow_extensions: false → policy_blocked，改 line.multi（上下界两条线）+ 填充
    - 区间是统计分布而非确定性范围 → 可考虑 boxplot 序列
  adjacent: [line.multi, line.basic]
  risks: [须声明依赖, 上下界与均值线视觉层级要分明]
  pair_with: [table.detail]
